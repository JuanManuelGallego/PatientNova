name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  portal:
    name: Portal (Node 22.x)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Portal

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: Portal/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build
      - run: pnpm test

  server:
    name: Server (Node 22.x)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: patientnova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d patientnova_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: "3001"
      DATABASE_URL: postgresql://test:test@localhost:5432/patientnova_test
      ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY || '' }}
      LOG_LEVEL: info
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX: "30"
      BCRYPT_ROUNDS: "12"
      COOKIE_DOMAIN: localhost
      MAX_FAILED_ATTEMPTS: "5"
      LOCKOUT_DURATION_MS: "900000"
      DEFAULT_TIMEZONE: America/Bogota
      DEFAULT_CURRENCY: COP
      ENABLE_SCHEDULER: "false"
      DAILY_REMINDER_HOUR: "18"
      TWILIO_ACCOUNT_SID: dummySID
      TWILIO_AUTH_TOKEN: dummyToken
      TWILIO_WHATSAPP_FROM: dummyNumber
      TWILIO_SMS_FROM: dummySMSNumber
      TWILIO_WEBHOOK_BASE_URL: https://example.com/twilio
      TWILIO_WHATSAPP_USER_REMINDER_SID: dummyReminderSid
      TWILIO_WHATSAPP_USER_REMINDER_2_APPT_SID: dummyReminder2Sid
      TWILIO_WHATSAPP_USER_REMINDER_3_APPT_SID: dummyReminder3Sid
      TWILIO_WHATSAPP_USER_REMINDER_4_APPT_SID: dummyReminder4Sid
      TWILIO_WHATSAPP_USER_REMINDER_5_APPT_SID: dummyReminder5Sid
      TWILIO_WHATSAPP_USER_REMINDER_6_APPT_SID: dummyReminder6Sid
      TWILIO_WHATSAPP_USER_REMINDER_FAILED_SID: dummyReminderFailedSid
      TWILIO_WHATSAPP_USER_APPOINTMENT_STATUS_UPDATE_SID: dummyStatusSid
      TWILIO_WHATSAPP_PATIENT_APPOINTMENT_MEETING_LINK_SID: dummyMeetingLinkSid
      BREVO_API_KEY: xkeysib-dummy
      BREVO_FROM_EMAIL: no-reply@example.com
      BREVO_WEBHOOK_SECRET: dummy-brevo-webhook-secret
      AUTH_SECRET: dummy-auth-secret
      PORTAL_AUTH_SECRET: dummy-portal-auth-secret
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: dummy-admin-password
      GOOGLE_CLIENT_ID: dummy-google-client-id
      GOOGLE_CLIENT_SECRET: dummy-google-client-secret
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:3001/v1/google/oauth/callback
      PORTAL_URL: http://localhost:3000
      ENABLE_PORTAL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: Server/pnpm-lock.yaml
      - name: Generate encryption key
        run: echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U test -d patientnova_test; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run test:integration

  e2e:
    name: E2E Tests (Playwright, self-contained stack)
    runs-on: ubuntu-latest
    needs: [portal, server]

    # Throwaway stack: Postgres + API + Portal all inside this job. No staging data or secrets.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: patientnova_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d patientnova_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      # Server config comes from Server/.env.test (copied to Server/.env below, parsed by dotenv);
      # the variables here take precedence over it.
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/patientnova_e2e
      RATE_LIMIT_MAX: "100000"
      ENABLE_SCHEDULER: "false"
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      ADMIN_EMAIL: e2e-admin@example.com
      ADMIN_PASSWORD: E2e-Admin-Password-1
      # Playwright
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:3001/v1
      TEST_USER_EMAIL: e2e-admin@example.com
      TEST_USER_PASSWORD: E2e-Admin-Password-1
      APPT_TYPE_NAME: E2E Consulta
      APPT_TYPE_ID: 00000000-0000-4000-8000-0000000000a1
      LOCATION_NAME: E2E Consultorio
      LOCATION_ID: 00000000-0000-4000-8000-0000000000a2

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: |
            Server/pnpm-lock.yaml
            Portal/pnpm-lock.yaml

      - name: Install Server deps
        working-directory: Server
        run: pnpm install --frozen-lockfile
      - name: Prepare and build Server
        working-directory: Server
        run: |
          cp .env.test .env
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm exec tsup
      - name: Seed e2e data
        working-directory: Server
        run: pnpm run db:seed-e2e
      - name: Start API
        working-directory: Server
        run: |
          nohup node dist/server.js > ../server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/health && exit 0
            sleep 2
          done
          echo "API did not become healthy" >&2
          cat ../server.log
          exit 1

      - name: Install Portal deps
        working-directory: Portal
        run: pnpm install --frozen-lockfile
      - name: Build and start Portal
        working-directory: Portal
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: |
          pnpm run build
          nohup pnpm exec next start -p 3000 > ../portal.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/login && exit 0
            sleep 2
          done
          echo "Portal did not start" >&2
          cat ../portal.log
          exit 1

      - name: Install Playwright browsers
        working-directory: Portal
        run: pnpm exec playwright install chromium --with-deps
      - name: Run E2E tests
        working-directory: Portal
        run: pnpm exec playwright test -c e2e/playwright.config.ts

      # upload-artifact paths are relative to the workspace root (NOT the step's working-directory).
      # The HTML report is written to <cwd>/playwright-report (cwd = Portal) and traces/videos/screenshots
      # to the config's outputDir (Portal/e2e/test-results). Fail loudly if a path is ever wrong.
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            Portal/playwright-report/
            Portal/e2e/test-results/
          if-no-files-found: error
          retention-days: 30
      - name: Upload service logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-service-logs
          path: |
            server.log
            portal.log
          retention-days: 7
